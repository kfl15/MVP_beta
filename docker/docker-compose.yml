
services:
  ollama:
    image: ollama/ollama
    container_name: rag_ollama
    environment:
      - OLLAMA_NO_GPU=1
    volumes:
      - ./ollama:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD","ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: rag_backend
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_LLM_MODEL=mistral:7b-instruct-q4_K_M
      - OLLAMA_HTTP_RETRIES=3
      - OLLAMA_HTTP_BACKOFF=0.5
      - OLLAMA_HTTP_TIMEOUT=300

    volumes:
      - ../data:/app/data
      - ../chroma_store:/app/chroma_store
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"] 
      interval: 20s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: rag_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
