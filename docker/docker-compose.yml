services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    environment:
      - OLLAMA_NO_GPU=1
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 5

  backend:
    image: docker_backend:latest
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: rag_backend
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_LLM_MODEL=llama3.2:1b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
      - OLLAMA_HTTP_RETRIES=3
      - OLLAMA_HTTP_BACKOFF=0.5
      - OLLAMA_HTTP_TIMEOUT=300
      - RAG_INCLUDE_RAW_CHUNKS=0
      - RAG_MAX_CHUNKS=4
      - RAG_FALLBACK_SEARCH=1
      - RAG_FALLBACK_MATCHES_N=3
      - RAG_FALLBACK_LINES_PER_MATCH=3
    volumes:
      - ../data:/app/data
      - ../chroma_store:/app/chroma_store
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 20s
      timeout: 10s
      retries: 5

  frontend:
    image: docker_frontend:latest
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: rag_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  ollama_models:
